# Apply once with: kubectl apply -f argocd/service-backup.yaml -n argocd
# Resources live in two namespaces: backup (etcd job, created here) and
# harbor (Harbor DB job). No Secret manifests in the synced path: the
# pbs-backup Secrets are created by hand (README), so selfHeal can never
# overwrite them with a placeholder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adelerhof/service-backup
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
