# Security checks: this repository is public, so nothing secret may ever
# land in it. Runs on every push and pull request, and weekly (new
# detectors in TruffleHog can find old leaks).
#
# Actions are pinned by commit SHA (after the 2026-03 trivy-action tag
# hijack); Dependabot keeps the pins current (.github/dependabot.yml).
name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: 17 6 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Whole history up to this commit, every time (the repository is
      # small): a leak in an old commit stays public until rewritten.
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          base: ""
          head: ${{ github.sha }}
          version: 3.99.9
          extra_args: --results=verified,unknown,unverified

  private-info:
    name: private-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Internal addresses and hostnames: allowed in the private notes, not
      # here. Loopback (127.0.0.1) is fine. Add a pattern when a new kind of
      # private detail shows up.
      - name: No internal IPs, hostnames or private keys
        run: |
          set -u
          patterns=(
            '\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b'
            '\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\b'
            '\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b'
            '\b[a-z0-9-]+\.(home|ansible|lan|internal)\b'
            '\b178\.20\.173\.[0-9]{1,3}\b'
            '\b2a00:1d38:'
            'BEGIN [A-Z ]*PRIVATE KEY'
            '"kdf":'
          )
          found=0
          for p in "${patterns[@]}"; do
            if git grep -n -I -E "$p" -- . ':!.github/workflows/security.yml'; then
              echo "::error::private-info pattern matched: $p"
              found=1
            fi
          done
          exit "$found"
