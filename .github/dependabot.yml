# Version updates. Security updates are on in the repository settings.
# The cooldown skips releases younger than 14 days: most hijacked
# releases are found and pulled within days.
#
# Not covered on purpose: ETCD_VERSION and PG_MAJOR in the Dockerfile.
# They must match the cluster, not the newest release (see README).
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: actions
