apiVersion: v1
kind: Namespace
metadata:
  name: backup
  labels:
    # privileged: the etcd job needs host network (etcd only listens on
    # 127.0.0.1) and a read-only hostPath of /etc/kubernetes, and runs as
    # root (pki is mode 600). Same reasoning as pss-monitor.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# Nothing in this namespace accepts or makes pod-network connections. The
# etcd job runs on the host network, where NetworkPolicy doesn't apply (the
# Cilium host firewall does); this keeps any future non-host pod closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: backup
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: backup
automountServiceAccountToken: false
